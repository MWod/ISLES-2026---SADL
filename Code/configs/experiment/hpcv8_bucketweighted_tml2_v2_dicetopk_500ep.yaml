# @package _global_
# Per-sample bucket-weighted DC+TopK with `target_ml=2.0` - pushes the
# per-sample volume weighting harder toward tiny lesions. Default target_ml is
# 5.0; this experiment biases per-sample weights so that a 2 mL lesion sits at
# weight 1.0 and a 0.5 mL lesion sits at weight 4.0 (clipped).
defaults:
  - override /data: atlas_v2_train_v2
  - override /split: v2_site_disjoint_test3
  - override /preprocessing: nnunet_default
  - override /augmentation: nnunet_default
  - override /model: nnunet_v2
  - override /trainer: hpc_500ep
  - override /loss: bucket_weighted_dice_topk
seed: 42
nnunet_dataset_id: 510
nnunet_dataset_name: Dataset510_AtlasV2_V2
model:
  trainer_class: IslesTrainerBucketWeighted
# trainer.bucket.* is consumed by train.py after nnUNetTrainer init - sets the
# corresponding `isles_bucket_*` instance attrs on the trainer. Only
# IslesTrainerBucketWeighted (+ subclasses) has these attrs; other trainers see
# the hasattr guard and skip.
trainer:
  bucket:
    target_ml: 2.0
experiment_name: hpcv8_bucketweighted_tml2_v2_dicetopk_500ep
