# @package _global_
# Residual-encoder UNet (ResEnc) with dice_topk for architecture diversity
# alongside the PlainConvUNet baseline.
defaults:
  - override /data: atlas_v2_train_v2
  - override /split: v2_site_disjoint_test3
  - override /preprocessing: resenc
  - override /augmentation: nnunet_default
  - override /model: nnunet_resenc
  - override /trainer: hpc_500ep
  - override /loss: dice_topk
seed: 42
nnunet_dataset_id: 510
nnunet_dataset_name: Dataset510_AtlasV2_V2
model:
  trainer_class: IslesTrainerResEnc
experiment_name: hpcv6_resenc_v2_dicetopk_500ep
